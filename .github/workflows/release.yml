name: Auto Release

# Cuts a calver prerelease (vX.Y.Z-YYYYMMDD.N) on every push to main and
# publishes it to npm under the `next` tag; `latest` only moves through a
# curated base release (release/from-vX.Y.Z). `workflow_dispatch` is the
# manual retrigger — a workflow added by an API-created squash merge may not
# fire on that same push.
on:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_changes: ${{ steps.release.outputs.has_changes }}
    steps:
      - id: release
        uses: cad0p/semver-calver-release/release@v1
        with:
          skip_release: ${{ github.ref != 'refs/heads/main' }}

  publish:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: cad0p/semver-calver-release/npm-publish@v1
        with:
          tag: v${{ needs.release.outputs.version }}
